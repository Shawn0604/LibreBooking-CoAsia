services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - lb_prod_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes:
      - ./config/config.php:/var/www/html/config/config.php:ro
      - ./plugins/Authentication/ActiveDirectory/ActiveDirectory.config.php:/var/www/html/plugins/Authentication/ActiveDirectory/ActiveDirectory.config.php:ro
      - ./app.env:/var/www/html/.env:ro
      - lb_prod_uploads:/var/www/html/uploads
      - lb_prod_uploads_images:/var/www/html/Web/uploads/images
      - lb_prod_uploads_tos:/var/www/html/Web/uploads/tos
    depends_on:
      db:
        condition: service_healthy

  # Internal-only: published on the VM so anyone on the 10.1.0.0/16 network
  # can reach it directly via the internal DNS name, but nothing is NAT'd
  # or port-forwarded out to the public internet.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Only carries traffic for the LINE webhook's public hostname (see the
  # http://booking-hook.coasia.com block in Caddyfile) -- outbound-only
  # connection to Cloudflare, nothing opened in any firewall. The main app
  # (booking.coasia.com.tw) stays internal-only and is untouched by this.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy

volumes:
  lb_prod_db_data:
  lb_prod_uploads:
  lb_prod_uploads_images:
  lb_prod_uploads_tos:
  caddy_data:
  caddy_config:
