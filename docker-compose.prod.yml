services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - lb_prod_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes:
      - ./config/config.php:/var/www/html/config/config.php:ro
      - ./plugins/Authentication/ActiveDirectory/ActiveDirectory.config.php:/var/www/html/plugins/Authentication/ActiveDirectory/ActiveDirectory.config.php:ro
      - ./app.env:/var/www/html/.env:ro
      - lb_prod_uploads:/var/www/html/uploads
      - lb_prod_uploads_images:/var/www/html/Web/uploads/images
      - lb_prod_uploads_tos:/var/www/html/Web/uploads/tos
    depends_on:
      db:
        condition: service_healthy

  # No published ports: nothing on this VM is reachable from the network
  # directly. cloudflared makes an outbound-only connection to Cloudflare;
  # Cloudflare terminates public HTTPS and forwards to caddy over that
  # tunnel. There is nothing to open in any firewall for this to work.
  caddy:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy

volumes:
  lb_prod_db_data:
  lb_prod_uploads:
  lb_prod_uploads_images:
  lb_prod_uploads_tos:
